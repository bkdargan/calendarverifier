<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airbnb + Vrbo Sync Checker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Airbnb + Vrbo Calendar Sync Checker</h1>
  <p>Upload your Airbnb and Vrbo iCal files to detect mismatches and double‑booking risks.</p>

<div class="upload-section">
  <div>
    <h3>Airbnb iCal URL</h3>
    <input type="text" id="airbnbURL" placeholder="Paste Airbnb iCal link here">
  </div>

  <div>
    <h3>Vrbo iCal URL</h3>
    <input type="text" id="vrboURL" placeholder="Paste Vrbo iCal link here">
  </div>
</div>

<button id="compareBtn">Compare Calendars</button>

<div id="results"></div>

  <script src="ical.js"></script>
  <script src="script.js"></script>
</body>
</html>
